[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Tonviewer"
version = "1.3.0"
description = "Python SDK and CLI for TON wallets, transactions, Jettons, NFTs, collectible gifts, and Fragment lookups."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "- Y", email = "alexcrow221@gmail.com" }
]
maintainers = [{ name = "AhMed" }]
keywords = ["ton", "toncoin", "blockchain", "wallet", "nft", "jetton", "fragment", "telegram", "sdk", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "colorama>=0.4.6",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "tonsdk>=1.0.13",
    "urllib3>=1.26.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/z9zzzz/Tonviewer"
Documentation = "https://github.com/z9zzzz/Tonviewer/tree/main/docs"
Source = "https://github.com/z9zzzz/Tonviewer"
"Bug Tracker" = "https://github.com/z9zzzz/Tonviewer/issues"

[project.scripts]
Tonviewer = "tonviewer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
