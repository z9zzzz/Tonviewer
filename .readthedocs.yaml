# Read the Docs configuration for Tonviewer
# https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

python:
  install:
    # Install Tonviewer from the repository root (pyproject.toml).
    - method: pip
      path: .
    # Sphinx, the Read the Docs theme, and Markdown support.
    - requirements: docs/requirements.txt

sphinx:
  # Sphinx configuration file; keep this path in sync with your docs layout.
  configuration: docs/conf.py
  fail_on_warning: true
